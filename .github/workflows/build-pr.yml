name: Build PR
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: build-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
jobs:
  build-pr:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive

      - name: Audit direct struct field access
        run: |
          pip install libclang
          python dev/audit_direct_access_clang.py

      - name: Configure CMake
        run: cmake -S ${{github.workspace}} -B ${{github.workspace}}/build -G "Visual Studio 18 2026" -A x64 -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DDEVELOPER_MODE=ON -DREFRAMEWORK_BUILD_NUMBER=${{ github.event.pull_request.number }} -DREFRAMEWORK_BUILD_SHA=${{ github.event.pull_request.head.sha }} "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

      - name: Build REFramework
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --target REFramework

      - name: Upload dinput8.dll
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: REFramework
          path: ${{github.workspace}}/build/bin/REFramework/dinput8.dll
          if-no-files-found: error
